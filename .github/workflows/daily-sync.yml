name: Daily article sync

# Stáhne nové zahraniční články, přeloží je přes Gemini a publikuje na web
# (commitne nové soubory v content/articles/ zpět do repa).
#
# Předpoklady:
#   - repo secret GEMINI_API_KEY (Google AI Studio: https://aistudio.google.com/apikey)
#   - sloučené PR #2 (Gemini překlad) a #4 (publikační krok `npm run publish`)

on:
  schedule:
    # každý den v 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# nedovol souběžné běhy (commitují do stejné větve)
concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bjj-scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: bjj-scraper
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: bjj-scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape + translate (Gemini)
        working-directory: bjj-scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          DAYS_BACK: "2"
        run: npm run scrape

      - name: Publish to content/articles
        working-directory: bjj-scraper
        run: npm run publish

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # registr zpracovaných článků brání opakovanému překladu příště
          git add content/articles bjj-scraper/popelina/processed-articles.json
          if git diff --staged --quiet; then
            echo "Žádné nové články."
          else
            git commit -m "chore: daily article sync [skip ci]"
            git push
          fi
